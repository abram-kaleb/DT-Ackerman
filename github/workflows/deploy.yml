name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Pastikan ini sesuai dengan nama branch utama kamu

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install and Build 🔧
        run: |
          npm install
          npm run build
        env:

          REACT_APP_ACKER_KEY: ${{ secrets.REACT_APP_ACKER_KEY }}

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build # Folder hasil npm run build
          branch: gh-pages # Branch tujuan untuk hosting